define command {
    command_name    bg_check_http
    command_line    $USER1$/check_http -H 127.0.0.1 -p $ARG1$
}
define command {
    command_name    bg_check_app
    command_line    $USER1$/check_app_version $ARG1$
}
define command {
    command_name    bg_check_ssh
    command_line    $USER1$/check_ssh -H 127.0.0.1
}
define command {
    command_name    bg_check_load
    command_line    $USER1$/check_load -w 5,4,3 -c 10,6,4
}
define command {
    command_name    bg_check_disk
    command_line    $USER1$/check_disk -w 20% -c 10% -p /
}

define host {
    use             linux-server
    host_name       bluegreen-server
    alias           Blue-Green Server
    address         127.0.0.1
}

define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     HTTP Router port 80
    check_command           bg_check_http!80
    max_check_attempts      1
    check_interval          1
    retry_interval          1
}
define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     HTTP Blue port 8081
    check_command           bg_check_http!8081
    max_check_attempts      1
    check_interval          1
    retry_interval          1
}
define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     HTTP Green port 8082
    check_command           bg_check_http!8082
    max_check_attempts      1
    check_interval          1
    retry_interval          1
}
define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     App Version Blue
    check_command           bg_check_app!8081
    max_check_attempts      1
    check_interval          1
    retry_interval          1
}
define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     App Version Green
    check_command           bg_check_app!8082
    max_check_attempts      1
    check_interval          1
    retry_interval          1
}
define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     SSH
    check_command           bg_check_ssh
}
define service {
    use                     generic-service
    host_name               bluegreen-server
    service_description     CPU Load
    check_command           bg_check_load
}
define service {
    use                     generic-service
    host_name               bluegreen-server
